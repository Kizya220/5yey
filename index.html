<!DOCTYPE html>
<html lang="="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vorovskoy Spin</title>
  <style>
    body {
      background: linear-gradient(#000000, #1a1a1a);
      color: white;
      font-family: 'Arial Black', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      margin-bottom: 10px;
    }
    #reels {
      display: flex;
      gap: 15px;
      font-size: 60px;
      padding: 20px;
      background: #222;
      border: 4px solid gold;
      border-radius: 20px;
      box-shadow: 0 0 20px gold;
    }
    .reel {
      width: 70px;
      height: 70px;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 15px;
      border: 2px solid #555;
    }
    #controls {
      margin-top: 20px;
    }
    button {
      font-size: 20px;
      padding: 12px 24px;
      background: gold;
      color: black;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px #999;
    }
    button:active {
      box-shadow: 0 2px #666;
      transform: translateY(2px);
    }
    #balance, #bet {
      margin: 10px;
      font-size: 20px;
    }
    #betInput {
      width: 80px;
      font-size: 18px;
    }
    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>🎰 Vorovskoy Spin</h1>
  <div id="balance">Баланс: ...</div>
  <div id="bet">Ставка: <input type="number" id="betInput" value="0.10" step="0.10" /></div>
  <div id="reels">
    <div class="reel">❓</div>
    <div class="reel">❓</div>
    <div class="reel">❓</div>
  </div>
  <div id="controls">
    <button onclick="spin()">SPIN</button>
  </div>
  <footer>Powered by Kizya</footer>
  <script>
    const symbols = ['🍒', '🍋', '💎', '7️⃣', '⭐', '🔥', '🍀', '🔔', 'SC'];
    let balance = 100;
    let freeSpins = 0;

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    function updateBalance() {
      document.getElementById("balance").innerText = `Баланс: ${balance.toFixed(2)} фішок` + (freeSpins ? ` | 🎁 Фріспіни: ${freeSpins}` : "");
    }

    function delay(ms) {
      return new Promise(res => setTimeout(res, ms));
    }

    async function spin() {
      const bet = parseFloat(document.getElementById('betInput').value);
      if (!freeSpins && bet > balance) {
        alert("Недостатньо фішок!");
        return;
      }
      if (!freeSpins) balance -= bet;

      let reelElems = document.querySelectorAll('.reel');
      let result = [];
      for (let i = 0; i < 3; i++) {
        reelElems[i].innerText = "🔄";
      }
      await delay(400);
      for (let i = 0; i < 3; i++) {
        const sym = symbols[Math.floor(Math.random() * symbols.length)];
        result.push(sym);
        reelElems[i].innerText = sym;
        await delay(300);
      }

      const scatterCount = result.filter(x => x === 'SC').length;
      if (scatterCount >= 4) {
        freeSpins += 10;
        alert("🎁 Бонусні фріспіни: +10!");
      }

      if (result[0] === result[1] && result[1] === result[2]) {
        let win = bet * 10;
        balance += win;
        alert(`🎉 Виграш! +${win.toFixed(2)} фішок`);
      }

      if (freeSpins) freeSpins--;
      updateBalance();

      Telegram.WebApp.sendData(JSON.stringify({ result, balance, bet, freeSpins }));
    }

    updateBalance();
  </script>
</body>
</html>
